name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit --strict

      - name: Check for unused dependencies
        run: |
          # Install depcheck if not available
          if ! command -v depcheck &> /dev/null; then
            npm install -g depcheck
          fi
          depcheck --ignores="jest,ts-jest,@types/*,@testing-library/*,identity-obj-proxy,autoprefixer,postcss,tailwindcss,jest-environment-jsdom,markdownlint-cli"

      - name: Check bundle size
        run: |
          npm run build
          echo "Build size analysis:"
          du -sh dist/
          echo "Largest files:"
          find dist/ -type f -exec du -h {} + | sort -rh | head -10

      - name: Check for console.log statements
        run: |
          if grep -r "console\.log" src/ --include="*.ts" --include="*.tsx"; then
            echo "Warning: console.log statements found in source code"
            echo "Consider removing them before production"
          else
            echo "No console.log statements found"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          echo "TODO/FIXME comments found:"
          grep -r "TODO\|FIXME" src/ --include="*.ts" --include="*.tsx" || echo "No TODO/FIXME comments found"

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          # Check if coverage meets thresholds
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"

          # Set minimum coverage threshold
          MIN_COVERAGE=80
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage $COVERAGE% is below minimum threshold of $MIN_COVERAGE%"
            exit 1
          else
            echo "Coverage $COVERAGE% meets minimum threshold of $MIN_COVERAGE%"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run accessibility tests
        run: |
          # Start a simple HTTP server
          npx serve dist -p 3000 &
          SERVER_PID=$!
          sleep 5

          # Basic accessibility checks using curl and grep
          echo "Running basic accessibility checks..."

          # Check if the page loads
          if curl -s http://localhost:3000 > /dev/null; then
            echo "✓ Page loads successfully"
          else
            echo "✗ Page failed to load"
            kill $SERVER_PID
            exit 1
          fi

          # Check for basic HTML structure
          HTML_CONTENT=$(curl -s http://localhost:3000)

          # Check for title tag
          if echo "$HTML_CONTENT" | grep -q "<title>"; then
            echo "✓ Page has a title tag"
          else
            echo "✗ Page missing title tag"
          fi

          # Check for React root element
          if echo "$HTML_CONTENT" | grep -q 'id="root"'; then
            echo "✓ Page has React root element"
          else
            echo "✗ Page missing React root element"
          fi

          # Check for basic HTML structure (div, body, etc.)
          if echo "$HTML_CONTENT" | grep -q "<div\|<body"; then
            echo "✓ Page has basic HTML structure"
          else
            echo "✗ Page missing basic HTML structure"
          fi

          # Check for alt attributes on images
          if echo "$HTML_CONTENT" | grep -q "<img.*alt="; then
            echo "✓ Images have alt attributes"
          else
            echo "⚠ No images with alt attributes found (may be acceptable)"
          fi

          # Check for proper HTML5 structure
          if echo "$HTML_CONTENT" | grep -q "<!DOCTYPE html>"; then
            echo "✓ Page uses HTML5 doctype"
          else
            echo "✗ Page missing HTML5 doctype"
          fi

          echo "Accessibility check completed"
          kill $SERVER_PID

  performance:
    name: Performance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Analyze bundle
        run: |
          echo "Bundle analysis:"
          echo "Total size:"
          du -sh dist/
          echo "JavaScript files:"
          find dist/ -name "*.js" -exec du -h {} + | sort -rh
          echo "CSS files:"
          find dist/ -name "*.css" -exec du -h {} + | sort -rh

          # Check for large files (>1MB)
          LARGE_FILES=$(find dist/ -type f -size +1M)
          if [ -n "$LARGE_FILES" ]; then
            echo "Warning: Large files found:"
            echo "$LARGE_FILES"
          else
            echo "No large files found"
          fi
